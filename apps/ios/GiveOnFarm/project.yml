name: GiveOnFarm
options:
  bundleIdPrefix: com.giveon
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    ENABLE_PREVIEWS: YES

targets:
  GiveOnFarm:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
      - path: Core
      - path: Features
      - path: DesignSystem
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.giveon.GiveOnFarm
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_STRICT_CONCURRENCY: complete
    info:
      path: Resources/Info.plist
      properties:
        CFBundleName: GiveOnFarm
        CFBundleDisplayName: Give On Farm
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundlePackageType: APPL
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocationWhenInUseUsageDescription: "농장 위치 기반 기상 정보 제공을 위해 사용됩니다."
        NSUserNotificationsUsageDescription: "폭염·한파 위험 경보 알림을 받기 위해 사용됩니다."
        UIBackgroundModes:
          - remote-notification

  GiveOnFarmTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests
        optional: true
    dependencies:
      - target: GiveOnFarm
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.giveon.GiveOnFarmTests
